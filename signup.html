<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up Page</title>
    <link rel="stylesheet" href="css/signup.css">
</head>
<body>
    <div class="container">

    <div class="welcome">
        <h1>Come join us!</h1>

        <p>
            We are so excited to have you here. If you
            haven't already, create an account to get
            access to exclusive offers, rewards, and
            discounts.
        </p>

        <a href="#" class="signin">
            Already have an account? Signin.
        </a>
    </div>

    <div class="signup">
        <h1>Signup</h1>

        <form>
            <input type="text" placeholder="Fullname" required>

            <input type="email" placeholder="Email Address" required>

            <input type="password" placeholder="Password" required>

            <input type="password" placeholder="Confirm Password" required>

            <button type="submit">Signup</button>
        </form>

        <p class="social-text">or signup with</p>

        <div class="social-icons">
            <a href="#" class="facebook">f</a>
            <a href="#" class="google">G+</a>
            <a href="#" class="linkedin">in</a>
        </div>
    </div>

</div>
    
            
                
        
            
    

    
    
</body>
</html>
